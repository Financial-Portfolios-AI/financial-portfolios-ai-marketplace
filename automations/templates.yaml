# The single source for Financial Portfolios journeys and automation templates.
#
# `scripts/build.py` renders this into:
#   skills/<id>/SKILL.md            portable Agent Skills: claude.ai, Claude Desktop, ChatGPT
#   dist/<id>.zip                   the same, one zip per skill, for upload
#   plugins/financial-portfolios/skills/automation-templates/SKILL.md
#   plugins/financial-portfolios/commands/schedule.md
#   plugins/financial-portfolios/commands/start.md
#   commands/financial-portfolios/<journey>.toml  Gemini CLI commands (/financial-portfolios:<journey>)
#   AGENTS.md                       guidance for Codex, Cursor and other agents
#   README.md                       the journey table, between the journeys markers
#   automations/README.md           copy-paste prompts per vendor (Gemini Spark, Muse, ChatGPT tasks)
#
# Edit here, then run `python scripts/build.py`. CI runs `--check`, which fails on drift.

rules: |
  - Financial Portfolios AI data is informational and educational only: never a recommendation,
    advice or a suitability assessment.
  - A portfolio with `delayed: true` is the public book, about 45 days old: give its `as_of` date
    and never present it as current.
  - Performance comes only from `get_portfolio_performance` / `get_portfolio_metrics`; include their
    `disclaimer` in full and unaltered. Never compute a return from any other source.
  - Attribute anything taken from another connector (news, prices, positions) to that connector.

# ---------------------------------------------------------------------------------------------
# Journeys: one skill each. These are what the customer invokes by name.
# ---------------------------------------------------------------------------------------------
journeys:
  - id: portfolio-start
    journey: start
    mcp_prompt: start_here
    command: "/financial-portfolios:start"
    panel: open_access_centre
    title: Start here
    description: >-
      Menu of what you can do with your Financial Portfolios AI model portfolios, and which extra
      connectors each needs. Use when the user asks what Financial Portfolios AI can do or how to get started.
    body: |
      Use the `start_here` prompt's approach:
      1. Call `list_portfolios`; note which are subscribed and which are delayed.
      2. Check which other connectors are available in this conversation: a market-data or news
         connector, and a brokerage or aggregator connector. Do not call them.
      3. Offer the journeys below in one short table, marking any whose connector is missing:
         access, show a portfolio, performance, holdings news, what the portfolios share, drift,
         align my account, and scheduled digests.
      4. Ask which one they want and offer to start it.

  - id: portfolio-overview
    journey: portfolio
    mcp_prompt: portfolio_review
    command: "/financial-portfolios:portfolio"
    panel: open_portfolio_explorer
    title: Show me a portfolio
    description: >-
      Show a Financial Portfolios AI model portfolio: holdings, sector mix, concentration and what
      changed recently. Use when the user asks to see a portfolio or "my holdings".
    body: |
      1. If no portfolio is named, `list_portfolios` and use the subscribed ones.
      2. Prefer `open_portfolio_explorer` so the user can browse it. If panels are not shown,
         answer in text instead.
      3. In text: `get_portfolio_allocation` (top holdings and cash), `get_portfolio_concentration`
         (sector mix, effective N), `get_portfolio_changes` for the last 90 days.
      4. Offer the next step: performance, holdings news, or what it shares with the other books.

  - id: portfolio-performance
    journey: performance
    mcp_prompt: portfolio_performance
    command: "/financial-portfolios:performance"
    panel: null
    title: How has it done
    description: >-
      How a Financial Portfolios AI model portfolio has performed against its benchmark, with risk
      statistics and best and worst holdings. Hypothetical and simulated.
    body: |
      1. `get_portfolio_performance`, then `get_portfolio_metrics` for best and worst holdings.
      2. If `available` is false, report its `reason`; it is not an error and not zero.
      3. Show the figures as returned, and then the `disclaimer` in full.

  - id: holdings-news
    journey: holdings-news
    mcp_prompt: market_research_digest
    command: "/financial-portfolios:holdings-news"
    panel: null
    title: News on what it holds
    description: >-
      Recent news and context for the largest holdings of a Financial Portfolios AI model
      portfolio, using a connected news or market-data connector.
    body: |
      1. `get_portfolio_allocation`; take the ten largest holdings.
      2. If no news or market-data connector is available, say that one is needed and stop.
      3. For each holding, resolve the ticker to a company with that connector, then fetch news
         from the last seven days. Skip holdings with nothing new.
      4. One or two lines per holding, each attributed to its source. Keep the portfolio's data and
         the outside news visibly separate. Draw no buy or sell conclusion.

  - id: portfolio-breadth
    journey: breadth
    mcp_prompt: most_held_stocks
    command: "/financial-portfolios:breadth"
    panel: open_breadth_board
    title: What the portfolios agree on
    description: >-
      What Financial Portfolios AI model portfolios hold in common: most widely held stocks,
      overlap between books, and each one's dominant sector.
    body: |
      Prefer `open_breadth_board`. In text, report the most widely held names, the overlap between
      each pair by name and by weight, and each book's dominant sector and effective N.

  - id: portfolio-drift
    journey: drift
    mcp_prompt: drift_check
    command: "/financial-portfolios:drift"
    panel: null
    title: How far my account has drifted
    description: >-
      Compare the user's real brokerage holdings against a Financial Portfolios AI model portfolio
      and report the drift. Reports only; proposes no trades.
    body: |
      1. Read positions read-only from a connected brokerage or aggregator. If none is connected,
         ask the user to paste `ticker,quantity` rows instead. Never ask for credentials.
      2. `get_portfolio_allocation` for the model.
      3. Show a table of model weight, account weight and difference, largest first. Flag names
         held in only one of the two.
      4. Stop there. Prepare no orders. If they want to act, offer the "align my account" journey.

  - id: portfolio-align
    journey: align
    mcp_prompt: rebalance_advisor
    command: "/financial-portfolios:rebalance, then /financial-portfolios-broker:to-orders"
    panel: open_rebalance_studio
    title: Align my account
    description: >-
      Align the user's holdings to a Financial Portfolios AI model portfolio: compute the arithmetic,
      then optionally propose order tickets that the user confirms and places.
    body: |
      1. Read positions from a connected brokerage, then `open_rebalance_studio` with them so the
         user can check them. Without panels, confirm them in text and call `rebalance_portfolio`.
      2. Present the result as a table. Say plainly that nothing has been sent.
      3. Only if the user asks: turn it into order tickets for their broker. Confirm each batch
         explicitly before anything is sent. There is no standing authorisation.
      4. Never invent a price, balance or fill. Flag any symbol the broker does not recognise.

# The eighth journey is served by the automation templates below (skill `portfolio-automations`).
keep_me_posted:
  journey: keep-me-posted
  title: Keep me posted
  mcp_prompt: portfolio_digest
  command: "/financial-portfolios:schedule (or /financial-portfolios:digest once)"
  skill: portfolio-automations
  panel: null

# ---------------------------------------------------------------------------------------------
# Automation templates: recurring, unattended, read-only.
# ---------------------------------------------------------------------------------------------
automations:
  - id: weekly-digest
    title: Weekly portfolio digest
    cadence: Every Monday at 08:00
    cron: "0 8 * * 1"
    needs: []
    prompt: |
      Using Financial Portfolios AI, summarise what changed in each portfolio I subscribe to over the
      last 7 days: additions, removals, the three largest weight changes and turnover. Skip any
      portfolio with no changes. If nothing changed anywhere, reply with one sentence.

  - id: rebalance-alert
    title: New publication alert
    cadence: Every weekday at 07:00
    cron: "0 7 * * 1-5"
    needs: []
    prompt: |
      Using Financial Portfolios AI, check whether any portfolio I subscribe to has published a new
      allocation in the last 24 hours. If so, list what was added, removed, raised and cut. If not,
      reply "No new publications."

  - id: drift-watch
    title: Drift watch
    cadence: Every Friday at 16:30
    cron: "30 16 * * 5"
    needs: [brokerage]
    prompt: |
      Read my positions from my brokerage connector (read-only) and compare them with the Financial
      Portfolios AI model portfolio {portfolio}. Report only holdings whose weight differs from the
      model by more than 2 percentage points, plus names held in only one of the two. Do not prepare
      or place any orders. If nothing exceeds the threshold, reply with one sentence.

  - id: holdings-news
    title: Holdings news
    cadence: Every weekday at 07:30
    cron: "30 7 * * 1-5"
    needs: [news]
    prompt: |
      Take the ten largest holdings of my Financial Portfolios AI portfolio {portfolio}. Using my news
      connector, list any news from the last 24 hours on those companies, one line each with its
      source. Skip companies with no news. Draw no buy or sell conclusions.

  - id: earnings-week
    title: Earnings this week
    cadence: Every Sunday at 18:00
    cron: "0 18 * * 0"
    needs: [market-data]
    prompt: |
      Using my market-data connector, list which holdings of my Financial Portfolios AI portfolios
      report earnings in the coming week, with the date and the portfolios that hold each one.

  - id: monthly-performance
    title: Monthly performance note
    cadence: First day of each month at 09:00
    cron: "0 9 1 * *"
    needs: []
    prompt: |
      Using Financial Portfolios AI, give the published performance of each portfolio I subscribe to,
      with its best and worst holdings. Include the disclaimer that comes with the figures, in full.
      Do not calculate any figure yourself.

  - id: research-digest
    title: Research digest
    cadence: Every Thursday at 12:00
    cron: "0 12 * * 4"
    needs: []
    prompt: |
      Using Financial Portfolios AI, summarise research posts published in the last 7 days, in two
      lines each, and flag any that mention a ticker held in my portfolios. If there are none, reply
      with one sentence.
